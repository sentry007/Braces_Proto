name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test-and-build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all workspaces (core, web, MCP, VS Code)
        run: npm run build

      - name: Core, MCP and VS Code tests
        run: npm test

      - name: Pack and install test (npm tarballs)
        run: npm run test:pack

      - name: Package VS Code extension (.vsix)
        run: npm run package --workspace=bracer-vscode

      - name: Upload VS Code extension (.vsix)
        uses: actions/upload-artifact@v4
        with:
          name: bracer-vscode-extension
          path: packages/vscode/*.vsix

  e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Build core and web
        run: npm run build:core && npm run build:web

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/test-results
