name: Monorepo CI & Multi-Platform Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build All Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build All Workspaces (Core, Web, MCP, VSCode)
        run: npm run build

      - name: Run Core & MCP Unit Tests
        run: npm test

      - name: Package VS Code Extension (.vsix)
        run: |
          cd packages/vscode
          npx @vscode/vsce package --no-dependencies

      - name: Upload VS Code Extension (.vsix) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: braces-vscode-extension
          path: packages/vscode/*.vsix
