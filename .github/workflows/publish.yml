name: Publish Release

# Push a tag like v1.0.0 to publish every package. Required repository secrets:
#   NPM_TOKEN  - npm automation token with publish rights for bracer and bracer-mcp
#   VSCE_PAT   - Azure DevOps token for the "sentry007" VS Code Marketplace publisher
#   OVSX_PAT   - Open VSX access token for the "sentry007" namespace
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance + MCP Registry OIDC login

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Core first: bracer-mcp depends on the published bracer package
      - name: Publish bracer (core) to npm
        run: npm publish --workspace=bracer --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish bracer-mcp to npm
        run: npm publish --workspace=bracer-mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code extension
        run: npm run package --workspace=bracer-vscode

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode
        run: npx @vscode/vsce publish --no-dependencies --packagePath bracer-vscode-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: packages/vscode
        run: npx ovsx publish bracer-vscode-*.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to the MCP Registry
        working-directory: packages/mcp
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
